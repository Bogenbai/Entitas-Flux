name: CI

on:
  push:
    branches: [ master ]
    paths-ignore:
      - '**.md'
      - 'docs/**'
  pull_request:
    branches: [ master ]
    paths-ignore:
      - '**.md'
      - 'docs/**'
  workflow_dispatch:       # manual start from Actions tab

# NOTE: no `schedule:` on purpose. GitHub auto-disables workflows that have a cron
# trigger in repositories with no activity for ~60 days — and it disables the WHOLE
# workflow, so push and pull_request checks die silently with it. That is exactly what
# happened between v0.0.6 (June) and v0.1.0: PRs #6 and #7 got no checks at all and
# nobody noticed. A weekly rebuild of unchanged code is not worth that risk.

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
  
jobs:
  build-test:
    name: Build & Test (Ubuntu)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          # 6.0 builds the framework and its tests; 8.0 is only for the benchmarks.
          dotnet-version: |
            6.0.x
            8.0.x

      - name: Make build.sh executable
        run: chmod +x ./src/Entitas-Flux/build.sh

      - name: Build (build.sh)
        run: ./src/Entitas-Flux/build.sh

      - name: Test (solution)
        run: dotnet test ./src/Entitas-Flux/Entitas.sln --nologo --configuration Release

      # Built, not run: shared runners share their CPU, so timings from them would be
      # noise dressed up as data. Building still catches a benchmark that stopped
      # compiling after a refactor — see benchmarks/README.md for how to measure.
      - name: Build benchmarks
        run: dotnet build ./benchmarks/Entitas.Benchmarks -c Release --nologo

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Artifacts
          path: |
            **/Artifacts/**
          if-no-files-found: warn
          retention-days: 7
