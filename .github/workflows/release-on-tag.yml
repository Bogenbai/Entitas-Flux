name: Release on tag

on:
  push:
    tags:
      - 'v*'   # for example v1.0.0

permissions:
  contents: write

jobs:
  build-test:
    name: Build & Test (Ubuntu)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '6.0.x' 

      - name: Make build.sh executable
        run: chmod +x ./src/Entitas-Flux/build.sh

      - name: Build (build.sh)
        env:
          FLUX_VERSION: ${{ github.ref_name }}
        run: ./src/Entitas-Flux/build.sh

      - name: Test (solution)
        run: dotnet test ./src/Entitas-Flux/Entitas.sln --nologo --configuration Release

      - name: Assemble UPM package
        run: |
          chmod +x ./src/Entitas-Flux/package.sh
          ./src/Entitas-Flux/package.sh ${{ github.ref_name }}

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Artifacts-Linux
          path: |
            **/Artifacts/**
          if-no-files-found: error

  release:
    name: Create GitHub Release
    needs: build-test
    runs-on: ubuntu-latest

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: Artifacts-Linux
          path: ./release-bundle

      - name: Create archive with folder structure
        run: |
          cd release-bundle
          # zip recursively, keep dirs; -9 max compression (optional)
          zip -r -9 Entitas-Flux-${{ github.ref_name }}.zip .
          cd ..

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: "Release ${{ github.ref_name }}"
          body: |
            Automated release for tag ${{ github.ref_name }}
            Commit: ${{ github.sha }}
          draft: false
          prerelease: false
          files: |
            release-bundle/Entitas-Flux-${{ github.ref_name }}.zip

  upm:
    name: Publish UPM branch
    needs: build-test
    runs-on: ubuntu-latest

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: Artifacts-Linux
          path: ./artifacts

      # The package is published as the ROOT of a generated `upm` branch, so consumers
      # install it with a plain git URL:
      #   https://github.com/Bogenbai/Entitas-Flux.git#upm          (latest)
      #   https://github.com/Bogenbai/Entitas-Flux.git#upm/v0.1.0   (pinned)
      # The branch is generated output, so force-pushing it is intended; the per-version
      # tags are what make older versions pinnable.
      - name: Push package to the upm branch
        run: |
          # upload-artifact roots the archive at the common ancestor of the matched
          # files, so locate the package rather than assuming a fixed depth.
          PACKAGE="$(find ./artifacts -type d -name package -exec test -f '{}/package.json' \; -print | head -1)"
          if [ -z "$PACKAGE" ]; then
            echo "error: no UPM package found in the artifacts" >&2
            exit 1
          fi
          cd "$PACKAGE"
          git init -q .
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Entitas Flux ${{ github.ref_name }}"
          git branch -M upm
          git remote add origin https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git
          git push -f origin upm
          git tag "upm/${{ github.ref_name }}"
          git push -f origin "upm/${{ github.ref_name }}"
